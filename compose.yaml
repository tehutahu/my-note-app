name: my-note-app
services:
  init:
    image: node:22.23.2-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
    user: '0:0'
    command: ['sh', '-c', 'chown ${APP_UID:-1000}:${APP_GID:-1000} /dependencies /store']
    volumes:
      - dependencies:/dependencies
      - store:/store
  app:
    build: .
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    working_dir: /workspace
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - store:/pnpm/store
    ports:
      - '127.0.0.1:5173:5173'
    command: ['pnpm', 'run', 'dev', '--host', '0.0.0.0']
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    working_dir: /workspace
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - store:/pnpm/store
    command: ['sh', '-c', 'pnpm run build && pnpm run e2e']
  preview:
    build: .
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    volumes:
      - ./dist:/workspace/dist:ro
      - ./scripts/serve.mjs:/workspace/serve.mjs:ro
    ports:
      - '127.0.0.1:4173:4173'
    command: ['node', 'serve.mjs']
volumes:
  dependencies:
  store:
