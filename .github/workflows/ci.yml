name: Container checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm app pnpm install --frozen-lockfile
      - run: docker compose run --rm app npm test
      - run: docker compose run --rm app pnpm run check
      - run: docker compose run --rm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/
          retention-days: 14
